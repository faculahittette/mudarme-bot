name: mudarme-bot

on:
  # Boton "Run workflow" (web o app de GitHub en el celu).
  workflow_dispatch:
  # Automatico 2 veces por dia. Cron en UTC: 15:07 y 23:07 UTC = 12:07 y 20:07
  # en Argentina. GitHub puede demorar unos minutos los cron.
  schedule:
    - cron: "7 15,23 * * *"

# Nunca dos corridas a la vez (igual la base evita duplicados, esto ahorra trabajo).
concurrency:
  group: mudarme-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Buscar y mandar a Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # Argenprop bloquea las IPs de GitHub (405): lo cubren las compus.
          SKIP_SITES: argenprop
          PYTHONUTF8: "1"
          COLUMNS: "160"
        run: python main.py
