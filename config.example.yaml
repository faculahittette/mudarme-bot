# Copia este archivo a config.yaml y completalo. Pasalo a main.py:
#   python main.py config.yaml

# Tope de paginas por URL. El bot corta solo cuando se agotan los resultados.
pages: 30

# Segundos de espera entre corridas cuando persist: true.
sleep_time: 300

# Bot de Telegram (grupo de mudarme-bot, separado de bot_bna_hogares).
bot_token: "TU_TOKEN_DE_BOT"
chat_room: "TU_CHAT_ID"

# true = loop infinito; false = una sola corrida.
persist: false

# Base de datos compartida (opcional). Si la completan en las dos compus con la
# MISMA url (ej: Postgres gratis de Neon), el estado se comparte y no se
# repiten avisos sin importar quien corra el bot. Vacio = SQLite local
# (scrapdep.db). La variable de entorno DATABASE_URL tiene prioridad.
#   database_url: "postgresql://usuario:clave@ep-xxxx.sa-east-1.aws.neon.tech/neondb?sslmode=require"
database_url: null

# URLs de busqueda YA filtradas (zona, precio, ambientes, antiguedad, apto credito).
# Reemplazar el numero de pagina por {}.
# Comenta (o deja en null) las que no uses.
#
# Cada sitio acepta UNA URL (string) o VARIAS (lista). Ejemplo con varias para
# sumar los "a estrenar" (que en Zonaprop quedan afuera del filtro "hasta X anos"):
#   zonaprop_full_url:
#     - "https://www.zonaprop.com.ar/...-hasta-10-anos-...-pagina-{}.html"
#     - "https://www.zonaprop.com.ar/...-a-estrenar-...-pagina-{}.html"

# Zonaprop/Argenprop: la URL del navegador con la pagina como {} (ej: ...-pagina-{}.html)
zonaprop_full_url: null
argenprop_full_url: null

# Remax: la URL del request a la API (F12 -> Network -> Fetch/XHR), con page={} (0-indexed).
# Barrios via `locations=in::::<id>@<Nombre>,...:::` (Caballito=25009,
# Parque Chacabuco=25027, Villa Crespo=25042). NO incluir `&landingPath=...`:
# hace que la API ignore `locations`.
remax_full_url: null

# Roomix: armá la busqueda en roomix.ai (el buscador entiende texto libre, ej:
# "deptos en Caballito apto credito 3 ambientes hasta 220000 usd") y copiá la URL
# agregando `?page={}` al final (sin el `?q=...`).
roomix_full_url: null

# BNA +Hogares: URL de la API (F12 -> Network -> `/api/propiedades?...`) con
# `&page={}` al final. Los barrios van en `ubicaciones` (ids `loc-...` que
# devuelve `/api/ubicaciones?q=<barrio>`). Lo que la API no filtra se aplica
# localmente con estos campos (null = no filtra):
bna:
  url: null
  tipos: ["Departamento", "PH", "Dúplex", "Tríplex", "Piso", "Casa"]
  antiguedad_max_anos: 15
  antiguedad_max_anos_por_tipo: {"PH": 20}
  ambientes_min: 3
  superficie_cubierta_min_m2: 62
  excluir_reservadas: true

# Otros sitios soportados (opcionales):
# Mercado Libre: pega la URL del navegador e inserta `_Desde_{}` en el path,
# justo despues del ultimo segmento (barrios) y antes de los modificadores
# (`_PriceRange_`, `_COVERED*AREA_`, etc.). El bot reemplaza {} por el offset
# de cada pagina (pagina 1 -> _Desde_1, pagina 2 -> _Desde_49, ...). Ejemplo:
#   "https://inmuebles.mercadolibre.com.ar/departamentos/venta/capital-federal/_Desde_{}_NoIndex_True"
mercadolibre_full_url: null
la_voz_full_url: null
properati_full_url: null
